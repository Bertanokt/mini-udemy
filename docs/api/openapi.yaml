        **Rol:** INSTRUCTOR (kursun sahibi). Kurallar dersin `contentType`'ına göre
        (Factory Method): VIDEO mp4/webm en fazla 200 MB; PDF pdf en fazla 20 MB;
        DOCUMENT pdf/docx/pptx en fazla 20 MB. Tür dosyanın içeriğinden (magic bytes)
        denetlenir. Sınırı aşan dosya 413, izin verilmeyen tür 415. Dosya adı sunucuda
        UUID olarak üretilir; eski dosya diskten silinir.
