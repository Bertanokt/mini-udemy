              schema:
                $ref: "#/components/schemas/ComplaintResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/admin/reports:
    get:
      tags: [Admin]
      summary: Platform raporu
      description: >
        **Rol:** ADMIN. Tarih aralığı verilmezse tüm zamanlar. Aralık kayıt, tamamlanma ve
        sertifika sayılarına uygulanır; kullanıcı ve kurs sayıları anlık durumdur.
      operationId: adminGetPlatformReport
      x-roles: [ADMIN]
      security:
        - bearerAuth: []
      parameters:
        - name: from
          in: query
          schema:
            type: string
            format: date
        - name: to
          in: query
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Rapor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformReportResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        `POST /api/auth/login` yanıtındaki `accessToken`. Başlık:
        `Authorization: Bearer <accessToken>`. Token'da `sub` kullanıcı id'si,
        `role` rol claim'idir.
  parameters:
    Id:
      name: id
      in: path
      required: true
      description: Yoldaki kaynağın id'si (ör. `/api/courses/{id}/sections`'da kursun id'si).
      schema:
        type: integer
        format: int64
        minimum: 1
    Page:
      name: page
      in: query
      description: Sayfa numarası (0'dan başlar).
      schema:
        type: integer
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      description: Sayfa boyutu.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  schemas:
    Role:
      type: string
      description: >
        Kullanıcı rolü. `ADMIN` hesabı kayıtla oluşturulamaz; yalnızca seed ile gelir.
      enum:
        - STUDENT
        - INSTRUCTOR
        - ADMIN
      example: STUDENT
    RegisterRole:
      type: string
      description: Kayıtta seçilebilen roller. `ADMIN` seçilemez.
      enum:
        - STUDENT
        - INSTRUCTOR
      example: STUDENT
    RegisterRequest:
      type: object
      required:
        - fullName
        - email
        - password
        - role
      properties:
        fullName:
          type: string
          minLength: 2
          maxLength: 100
          description: Ad soyad.
          example: Ayşe Yılmaz
        email:
          type: string
          format: email
          maxLength: 254
          description: Benzersiz e-posta adresi.
          example: ayse.yilmaz@example.com
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 72
          description: Parola (en az 8 karakter; üst sınır BCrypt'in 72 bayt sınırındandır).
          example: GucluParola123
        role:
          $ref: "#/components/schemas/RegisterRole"
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          example: ayse.yilmaz@example.com
        password:
          type: string
          format: password
          minLength: 1
          maxLength: 72
          example: GucluParola123
    AuthResponse:
      type: object
      required:
        - accessToken
        - tokenType
        - expiresIn
        - user
      properties:
        accessToken:
          type: string
          description: İmzalı JWT.
          example: eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiI0MiIsInJvbGUiOiJTVFVERU5UIn0.c2lnbmF0dXJl
        tokenType:
          type: string
          enum: [Bearer]
          example: Bearer
        expiresIn:
          type: integer
          format: int64
          minimum: 1
          description: Token'ın geçerlilik süresi (saniye).
          example: 3600
        user:
          $ref: "#/components/schemas/UserResponse"
    UserResponse:
      type: object
      required:
        - id
        - email
        - fullName
        - role
        - createdAt
      properties:
        id:
          type: integer
          format: int64
          example: 42
        email:
          type: string
          format: email
          example: ayse.yilmaz@example.com
        fullName:
          type: string
          example: Ayşe Yılmaz
        role:
          $ref: "#/components/schemas/Role"
        bio:
          type: string
          nullable: true
          maxLength: 500
          description: Kısa biyografi; girilmemişse null.
          example: Yazılım mühendisliği öğrencisiyim.
        createdAt:
          type: string
          format: date-time
          example: "2026-11-11T09:30:00Z"
    UpdateProfileRequest:
      type: object
      description: >
        Yalnızca bu iki alan güncellenebilir; e-posta ve rol değiştirilemez.
      additionalProperties: false
      required:
        - fullName
      properties:
        fullName:
          type: string
          minLength: 2
          maxLength: 100
          example: Ayşe Yılmaz
        bio:
          type: string
          nullable: true
          maxLength: 500
          description: Kısa biyografi; null ya da boş gönderilirse temizlenir.
          example: Yazılım mühendisliği öğrencisiyim.
    PasswordResetRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          example: ayse.yilmaz@example.com
    PasswordResetConfirmRequest:
      type: object
      required:
        - token
        - newPassword
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 255
          description: Parola yenileme bağlantısındaki tek kullanımlık token.
          example: 3f9a1c7e5b2d4a80b6c1e9d2f7a45b30
        newPassword:
          type: string
          format: password
          minLength: 8
          maxLength: 72
          example: YeniGucluParola456
    ErrorResponse:
      type: object
      description: >
        Tüm hataların ortak gövdesi (`common/exception` global handler'ı). `message`
        kullanıcıya gösterilebilir Türkçe bir cümledir; stack trace ya da iç ayrıntı içermez.
        `errors` alan adı - mesaj çiftleridir (doğrulama hatalarında dolu, diğerlerinde boş nesne).
      required:
        - status
        - message
        - errors
      properties:
        status:
          type: integer
          description: HTTP durum kodu.
          example: 409
        message:
          type: string
          description: Türkçe, kullanıcıya gösterilebilir hata cümlesi.
          example: Bu e-posta adresi zaten kayıtlı.
        errors:
          type: object
          description: Alan adı - hata mesajı çiftleri.
          additionalProperties:
            type: string
          example:
            email: Bu e-posta adresi zaten kayıtlı.
    CourseLevel:
      type: string
      enum: [BEGINNER, INTERMEDIATE, ADVANCED]
    CourseStatus:
      type: string
      description: >
        Kurs yaşam döngüsü (State deseni). Geçişler: DRAFT → IN_REVIEW (eğitmen),
        IN_REVIEW → PUBLISHED (yönetici onayı), IN_REVIEW → DRAFT (yönetici reddi, gerekçeli),
        PUBLISHED → UNPUBLISHED (eğitmen ya da yönetici), UNPUBLISHED → IN_REVIEW (eğitmen).
        Diğer geçişler 409.
      enum: [DRAFT, IN_REVIEW, PUBLISHED, UNPUBLISHED]
    ContentType:
      type: string
      description: >
        Ders içerik türü (Factory Method). VIDEO: mp4/webm ≤ 200 MB, tarayıcıda oynatılır.
        PDF: pdf ≤ 20 MB, tarayıcıda açılır. DOCUMENT: pdf/docx/pptx ≤ 20 MB, indirilir.
      enum: [VIDEO, PDF, DOCUMENT]
    ScoringType:
      type: string
      description: >
        Puanlama stratejisi. SINGLE_ANSWER: tek doğru şık, doğruysa sorunun puanı.
        MULTI_ALL_OR_NOTHING: tüm doğru şıklar ve yalnız onlar seçildiyse tam puan.
        MULTI_PARTIAL: doğru seçilen şık oranında puan, yanlış seçim puanı düşürür (en az 0).
      enum: [SINGLE_ANSWER, MULTI_ALL_OR_NOTHING, MULTI_PARTIAL]
    ComplaintStatus:
      type: string
      enum: [OPEN, REVIEWED, REJECTED]
    NotificationType:
      type: string
      enum: [ENROLLMENT_CREATED, LESSON_PUBLISHED, COURSE_APPROVED, COURSE_REJECTED, QUIZ_COMPLETED, CERTIFICATE_ISSUED]
    PageMeta:
      type: object
      description: Sayfalı yanıtların ortak alanları. `page` 0'dan başlar.
      required: [page, size, totalElements, totalPages]
      properties:
        page:
          type: integer
          example: 0
        size:
          type: integer
          example: 20
        totalElements:
          type: integer
          format: int64
          example: 57
        totalPages:
          type: integer
          example: 3
    UserSummary:
      type: object
      description: Başka bir kullanıcının herkese gösterilebilen bilgisi (e-posta yok).
      required: [id, fullName]
      properties:
        id:
          type: integer
          format: int64
        fullName:
          type: string
          example: Mehmet Demir
    CategoryRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
          example: Yazılım Geliştirme
    CategoryResponse:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
    CreateCourseRequest:
      type: object
      required: [title, description, categoryId, level]
      properties:
        title:
          type: string
          minLength: 3
          maxLength: 200
          example: Sıfırdan Java
        description:
          type: string
          minLength: 10
          maxLength: 5000
        categoryId:
          type: integer
          format: int64
          description: Var olan bir kategori; yoksa 400 (`errors.categoryId`).
        level:
          $ref: "#/components/schemas/CourseLevel"
        learningOutcomes:
          type: array
          maxItems: 20
          items:
            type: string
            minLength: 1
            maxLength: 300
          example: ["Nesne yönelimli programlamanın temelleri", "Koleksiyonlarla çalışma"]
    UpdateCourseRequest:
      $ref: "#/components/schemas/CreateCourseRequest"
    CourseResponse:
      type: object
      description: Kursun yönetim görünümü (eğitmen ve yönetici).
      required: [id, title, description, category, level, status, instructor, learningOutcomes, createdAt, updatedAt]
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        description:
          type: string
        category:
          $ref: "#/components/schemas/CategoryResponse"
        level:
          $ref: "#/components/schemas/CourseLevel"
        status:
          $ref: "#/components/schemas/CourseStatus"
        instructor:
          $ref: "#/components/schemas/UserSummary"
        coverUrl:
          type: string
          nullable: true
          description: Kapak yüklenmişse `/api/courses/{id}/cover`.
        learningOutcomes:
          type: array
          items:
            type: string
        rejectionReason:
          type: string
          nullable: true
          description: Son red gerekçesi; onaya yeniden gönderilince temizlenir.
        unpublishReason:
          type: string
          nullable: true
          description: Yayından kaldırma gerekçesi.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CourseSummaryResponse:
      type: object
      description: Katalog kartı.
      required: [id, title, category, level, status, instructor, lessonCount, totalDurationSeconds, enrollmentCount, reviewCount]
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        category:
          $ref: "#/components/schemas/CategoryResponse"
        level:
          $ref: "#/components/schemas/CourseLevel"
        status:
          $ref: "#/components/schemas/CourseStatus"
        instructor:
          $ref: "#/components/schemas/UserSummary"
        coverUrl:
          type: string
          nullable: true
        lessonCount:
          type: integer
        totalDurationSeconds:
          type: integer
        enrollmentCount:
          type: integer
        averageRating:
          type: number
          nullable: true
          description: Gizli olmayan değerlendirmelerin ortalaması; değerlendirme yoksa null.
          example: 4.6
        reviewCount:
          type: integer
    CourseSummaryPage:
      allOf:
        - $ref: "#/components/schemas/PageMeta"
        - type: object
          required: [content]
          properties:
            content:
              type: array
              items:
                $ref: "#/components/schemas/CourseSummaryResponse"
    CourseDetailResponse:
      allOf:
        - $ref: "#/components/schemas/CourseSummaryResponse"
        - type: object
          required: [description, learningOutcomes, sections]
          properties:
            description:
              type: string
            learningOutcomes:
              type: array
              items:
                type: string
            sections:
              type: array
              description: "`position` sırasıyla."
              items:
                $ref: "#/components/schemas/SectionResponse"
    UnpublishCourseRequest:
      type: object
      properties:
        reason:
          type: string
          maxLength: 1000
    ReasonRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 5
          maxLength: 1000
          example: Ders içerikleri kurs açıklamasıyla uyuşmuyor.
    FileUpload:
      type: object
      required: [file]
      properties:
        file:
          type: string
          format: binary
    PositionRequest:
      type: object
      required: [position]
      properties:
        position:
          type: integer
          minimum: 0
          description: Yeni sıra (0'dan başlar).
    SectionRequest:
      type: object
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
          example: Giriş
    SectionResponse:
      type: object
      required: [id, courseId, title, position, lessons]
      properties:
        id:
          type: integer
          format: int64
        courseId:
          type: integer
          format: int64
        title:
          type: string
        position:
          type: integer
        lessons:
          type: array
          description: "`position` sırasıyla."
          items:
            $ref: "#/components/schemas/LessonResponse"
    LessonRequest:
      type: object
      required: [title, contentType, mandatory, durationSeconds]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
          example: Değişkenler ve tipler
        contentType:
          $ref: "#/components/schemas/ContentType"
        mandatory:
          type: boolean
          description: Sertifika için tamamlanması zorunlu mu.
        durationSeconds:
          type: integer
          minimum: 0
          example: 540
    LessonResponse:
      type: object
      required: [id, sectionId, title, contentType, mandatory, durationSeconds, position, hasContent]
      properties:
        id:
          type: integer
          format: int64
        sectionId:
          type: integer
          format: int64
        title:
          type: string
        contentType:
          $ref: "#/components/schemas/ContentType"
        mandatory:
          type: boolean
        durationSeconds:
          type: integer
        position:
          type: integer
        hasContent:
          type: boolean
          description: İçerik dosyası yüklenmiş mi. Dosyanın kendisi `GET /api/lessons/{id}/content`.
    EnrollmentResponse:
      type: object
      required: [id, course, enrolledAt, progressPercent]
      properties:
        id:
          type: integer
          format: int64
        course:
          $ref: "#/components/schemas/CourseSummaryResponse"
        enrolledAt:
          type: string
          format: date-time
        progressPercent:
          type: number
          example: 75.0
        lastLessonId:
          type: integer
          format: int64
          nullable: true
        lastAccessedAt:
          type: string
          format: date-time
          nullable: true
    CourseProgressResponse:
      type: object
      required: [courseId, progressPercent, completedLessonIds, sections]
      properties:
        courseId:
          type: integer
          format: int64
        progressPercent:
          type: number
          minimum: 0
          maximum: 100
        completedLessonIds:
          type: array
          items:
            type: integer
            format: int64
        sections:
          type: array
          items:
            type: object
            required: [sectionId, progressPercent]
            properties:
              sectionId:
                type: integer
                format: int64
              progressPercent:
                type: number
                minimum: 0
                maximum: 100
    ResumeResponse:
      type: object
      required: [courseId, progressPercent]
      properties:
        courseId:
          type: integer
          format: int64
        lessonId:
          type: integer
          format: int64
          nullable: true
        lessonTitle:
          type: string
          nullable: true
        sectionId:
          type: integer
          format: int64
          nullable: true
        progressPercent:
          type: number
        lastAccessedAt:
          type: string
          format: date-time
          nullable: true
    OptionRequest:
      type: object
      required: [text, correct]
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 500
        correct:
          type: boolean
    QuestionRequest:
      type: object
      required: [text, points, options]
      properties:
        text:
          type: string
          minLength: 3
          maxLength: 2000
        points:
          type: integer
          minimum: 1
          maximum: 100
          example: 10
        options:
          type: array
          minItems: 2
          maxItems: 10
          description: "En az biri `correct: true` olmalı."
          items:
            $ref: "#/components/schemas/OptionRequest"
    OptionResponse:
      type: object
      required: [id, text, correct]
      properties:
        id:
          type: integer
          format: int64
        text:
          type: string
        correct:
          type: boolean
    QuestionResponse:
      type: object
      description: Eğitmen görünümü; doğru şık bilgisi içerir.
      required: [id, courseId, text, points, options]
      properties:
        id:
          type: integer
          format: int64
        courseId:
          type: integer
          format: int64
        text:
          type: string
        points:
          type: integer
        options:
          type: array
          items:
            $ref: "#/components/schemas/OptionResponse"
    QuizRequest:
      type: object
      required: [title, scoringType, passThreshold, required, questionIds]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        scoringType:
          $ref: "#/components/schemas/ScoringType"
        passThreshold:
          type: integer
          minimum: 0
          maximum: 100
          description: Geçme eşiği (yüzde).
          example: 70
        required:
          type: boolean
          description: Sertifika için geçilmesi zorunlu mu.
        questionIds:
          type: array
          minItems: 1
          description: Aynı kursun soru bankasından; verilen sıra sınavdaki sıradır.
          items:
            type: integer
            format: int64
    QuizSummaryResponse:
      type: object
      required: [id, sectionId, title, scoringType, passThreshold, required, questionCount]
      properties:
        id:
          type: integer
          format: int64
        sectionId:
          type: integer
          format: int64
        title:
          type: string
        scoringType:
          $ref: "#/components/schemas/ScoringType"
        passThreshold:
          type: integer
        required:
          type: boolean
        questionCount:
          type: integer
    StudentQuizResponse:
      allOf:
        - $ref: "#/components/schemas/QuizSummaryResponse"
        - type: object
          description: Doğru cevap bilgisi bu şemada bilerek yoktur.
          required: [questions]
          properties:
            questions:
              type: array
              items:
                type: object
                required: [id, text, points, options]
                properties:
                  id:
                    type: integer
                    format: int64
                  text:
                    type: string
                  points:
                    type: integer
                  options:
                    type: array
                    items:
                      type: object
                      required: [id, text]
                      properties:
                        id:
                          type: integer
                          format: int64
                        text:
                          type: string
    InstructorQuizResponse:
      allOf:
        - $ref: "#/components/schemas/QuizSummaryResponse"
        - type: object
          required: [questions]
          properties:
            questions:
              type: array
              items:
                $ref: "#/components/schemas/QuestionResponse"
    SubmitAttemptRequest:
      type: object
      required: [answers]
      properties:
        answers:
          type: array
          description: Cevapsız bırakılan soru listeye konmaz ve 0 puan alır.
          items:
            type: object
            required: [questionId, optionIds]
            properties:
              questionId:
                type: integer
                format: int64
              optionIds:
                type: array
                minItems: 1
                items:
                  type: integer
                  format: int64
    AttemptSummaryResponse:
      type: object
      required: [id, quizId, score, maxScore, percent, passed, submittedAt]
      properties:
        id:
          type: integer
          format: int64
        quizId:
          type: integer
          format: int64
        score:
          type: number
          example: 35
        maxScore:
          type: number
          example: 50
        percent:
          type: number
          example: 70.0
        passed:
          type: boolean
        submittedAt:
          type: string
          format: date-time
    AttemptResultResponse:
      allOf:
        - $ref: "#/components/schemas/AttemptSummaryResponse"
        - type: object
          required: [questions]
          properties:
            questions:
              type: array
              items:
                type: object
                required: [questionId, correct, earnedPoints, maxPoints]
                properties:
                  questionId:
                    type: integer
                    format: int64
                  correct:
                    type: boolean
                  earnedPoints:
                    type: number
                  maxPoints:
                    type: number
    CertificateResponse:
      type: object
      required: [id, courseId, courseTitle, studentName, verificationCode, issuedAt]
      properties:
        id:
          type: integer
          format: int64
        courseId:
          type: integer
          format: int64
        courseTitle:
          type: string
        studentName:
          type: string
        instructorName:
          type: string
        verificationCode:
          type: string
          example: K7Q2-M9XA-4T
        issuedAt:
          type: string
          format: date-time
    CertificateVerificationResponse:
      type: object
      required: [valid, courseTitle, studentName, issuedAt]
      properties:
        valid:
          type: boolean
          example: true
        courseTitle:
          type: string
        studentName:
          type: string
        issuedAt:
          type: string
          format: date-time
    ReviewRequest:
      type: object
      required: [rating]
      properties:
        rating:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type: string
          maxLength: 2000
    ReviewResponse:
      type: object
      required: [id, courseId, author, rating, hidden, createdAt, updatedAt]
      properties:
        id:
          type: integer
          format: int64
        courseId:
          type: integer
          format: int64
        author:
          $ref: "#/components/schemas/UserSummary"
        rating:
          type: integer
        comment:
          type: string
          nullable: true
        hidden:
          type: boolean
          description: Herkese açık listede her zaman false (gizliler listelenmez).
        moderationReason:
          type: string
          nullable: true
          description: Yalnız yönetici yanıtlarında dolu.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ReviewPage:
      allOf:
        - $ref: "#/components/schemas/PageMeta"
        - type: object
          required: [content]
          properties:
            content:
              type: array
              items:
                $ref: "#/components/schemas/ReviewResponse"
    RatingSummary:
      type: object
      required: [reviewCount, distribution]
      properties:
        averageRating:
          type: number
          nullable: true
          example: 4.3
        reviewCount:
          type: integer
          example: 12
        distribution:
          type: object
          description: Puan başına değerlendirme sayısı (anahtar "1"–"5").
          additionalProperties:
            type: integer
          example: {"1": 0, "2": 1, "3": 1, "4": 3, "5": 7}
    CourseReviewsResponse:
      allOf:
        - $ref: "#/components/schemas/ReviewPage"
        - type: object
          required: [summary]
          properties:
            summary:
              $ref: "#/components/schemas/RatingSummary"
    ReviewVisibilityRequest:
      type: object
      required: [hidden]
      properties:
        hidden:
          type: boolean
        reason:
          type: string
          maxLength: 1000
          description: "`hidden: true` iken zorunlu."
    CreateComplaintRequest:
      type: object
      required: [reason]
      description: "`courseId` ya da `reviewId`'den tam biri verilir."
      properties:
        courseId:
          type: integer
          format: int64
        reviewId:
          type: integer
          format: int64
        reason:
          type: string
          minLength: 5
          maxLength: 1000
    ComplaintResponse:
      type: object
      required: [id, reporter, reason, status, createdAt]
      properties:
        id:
          type: integer
          format: int64
        reporter:
          $ref: "#/components/schemas/UserSummary"
        courseId:
          type: integer
          format: int64
          nullable: true
        reviewId:
          type: integer
          format: int64
          nullable: true
        reason:
          type: string
        status:
          $ref: "#/components/schemas/ComplaintStatus"
        createdAt:
          type: string
          format: date-time
        resolvedAt:
          type: string
          format: date-time
          nullable: true
    ComplaintPage:
      allOf:
        - $ref: "#/components/schemas/PageMeta"
        - type: object
          required: [content]
          properties:
            content:
              type: array
              items:
                $ref: "#/components/schemas/ComplaintResponse"
    ComplaintStatusRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [REVIEWED, REJECTED]
    NotificationResponse:
      type: object
      required: [id, type, title, body, read, createdAt]
      properties:
        id:
          type: integer
          format: int64
        type:
          $ref: "#/components/schemas/NotificationType"
        title:
          type: string
          example: Kursunuz onaylandı
        body:
          type: string
        link:
          type: string
          nullable: true
          description: Ön yüzde açılacak yol, örn. `/courses/7`.
        read:
          type: boolean
        createdAt:
          type: string
          format: date-time
    NotificationPage:
      allOf:
        - $ref: "#/components/schemas/PageMeta"
        - type: object
          required: [content]
          properties:
            content:
              type: array
              items:
                $ref: "#/components/schemas/NotificationResponse"
    UnreadCountResponse:
      type: object
      required: [count]
      properties:
        count:
          type: integer
          example: 3
    CourseStatsResponse:
      type: object
      required: [courseId, enrollmentCount, averageProgressPercent, completionRate, quizzes, rating]
      properties:
        courseId:
          type: integer
          format: int64
        enrollmentCount:
          type: integer
        averageProgressPercent:
          type: number
        completionRate:
          type: number
          description: "%100 ilerlemeye ulaşan kursiyerlerin oranı (yüzde)."
        quizzes:
          type: array
          items:
            type: object
            required: [quizId, title, attemptCount, passRate]
            properties:
              quizId:
                type: integer
                format: int64
              title:
                type: string
              attemptCount:
                type: integer
              passRate:
                type: number
                description: Geçen denemelerin oranı (yüzde).
        rating:
          $ref: "#/components/schemas/RatingSummary"
    CourseStudentResponse:
      type: object
      required: [student, enrolledAt, progressPercent, quizResults]
      properties:
        student:
          $ref: "#/components/schemas/UserSummary"
        enrolledAt:
          type: string
          format: date-time
        progressPercent:
          type: number
        lastAccessedAt:
          type: string
          format: date-time
          nullable: true
        quizResults:
          type: array
          description: Her sınav için en iyi deneme.
          items:
            type: object
            required: [quizId, bestPercent, passed]
            properties:
              quizId:
                type: integer
                format: int64
              bestPercent:
                type: number
              passed:
                type: boolean
    CourseStudentPage:
      allOf:
        - $ref: "#/components/schemas/PageMeta"
        - type: object
          required: [content]
          properties:
            content:
              type: array
              items:
                $ref: "#/components/schemas/CourseStudentResponse"
    AdminUserResponse:
      type: object
      required: [id, email, fullName, role, active, createdAt]
      properties:
        id:
          type: integer
          format: int64
        email:
          type: string
          format: email
        fullName:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        active:
          type: boolean
        createdAt:
          type: string
          format: date-time
    AdminUserPage:
      allOf:
        - $ref: "#/components/schemas/PageMeta"
        - type: object
          required: [content]
          properties:
            content:
              type: array
              items:
                $ref: "#/components/schemas/AdminUserResponse"
    UserStatusRequest:
      type: object
      required: [active]
      properties:
        active:
          type: boolean
    PlatformReportResponse:
      type: object
      required: [usersByRole, coursesByStatus, enrollmentCount, completionCount, certificateCount, topCourses, categoryDistribution]
      properties:
        from:
          type: string
          format: date
          nullable: true
        to:
          type: string
          format: date
          nullable: true
        usersByRole:
          type: object
          additionalProperties:
            type: integer
          example: {"STUDENT": 120, "INSTRUCTOR": 8, "ADMIN": 2}
        coursesByStatus:
          type: object
          additionalProperties:
            type: integer
          example: {"DRAFT": 4, "IN_REVIEW": 2, "PUBLISHED": 15, "UNPUBLISHED": 1}
        enrollmentCount:
          type: integer
        completionCount:
          type: integer
        certificateCount:
          type: integer
        topCourses:
          type: array
          description: En çok kayıt alan ilk 10 kurs.
          items:
            type: object
            required: [courseId, title, enrollmentCount]
            properties:
              courseId:
                type: integer
                format: int64
              title:
                type: string
              enrollmentCount:
                type: integer
        categoryDistribution:
          type: array
          items:
            type: object
            required: [categoryId, name, courseCount]
            properties:
              categoryId:
                type: integer
                format: int64
              name:
                type: string
              courseCount:
                type: integer
  responses:
    BadRequest:
      description: >
        İstek geçersiz (400): doğrulama hatası, eksik alan, yasak alan ya da geçersiz /
        süresi dolmuş / kullanılmış parola yenileme token'ı.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            validation:
              summary: Alan doğrulama hatası
              value:
                status: 400
                message: Girilen bilgilerde hata var.
                errors:
                  email: Geçerli bir e-posta adresi girin.
                  password: Parola en az 8 karakter olmalıdır.
            adminRole:
              summary: Kayıtta ADMIN rolü seçildi
              value:
                status: 400
                message: Girilen bilgilerde hata var.
                errors:
                  role: Bu rol ile kayıt olunamaz.
            invalidResetToken:
              summary: Geçersiz ya da süresi dolmuş parola yenileme token'ı
              value:
                status: 400
                message: Parola yenileme bağlantısı geçersiz ya da süresi dolmuş.
                errors: {}
    Unauthorized:
      description: >
        Kimlik doğrulanamadı (401): token yok, geçersiz ya da süresi dolmuş; girişte
        e-posta veya parola yanlış.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            invalidCredentials:
              summary: Girişte e-posta veya parola yanlış
              value:
                status: 401
                message: E-posta veya parola hatalı.
                errors: {}
            missingToken:
              summary: Token yok, geçersiz ya da süresi dolmuş
              value:
                status: 401
                message: Oturumunuz geçersiz ya da süresi dolmuş. Lütfen tekrar giriş yapın.
                errors: {}
    Forbidden:
      description: "Bu işlem için yetkiniz yok (403): rol yetersiz ya da hesap devre dışı."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            deactivated:
              summary: Hesap devre dışı
              value:
                status: 403
                message: Hesabınız devre dışı bırakılmış.
                errors: {}
            insufficientRole:
              summary: Rol yetersiz
              value:
                status: 403
                message: Bu işlem için yetkiniz yok.
                errors: {}
    NotFound:
      description: Kaynak bulunamadı (404).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            status: 404
            message: Kullanıcı bulunamadı.
            errors: {}
    Conflict:
      description: "Çakışma (409): kaynak zaten var."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            status: 409
            message: Bu e-posta adresi zaten kayıtlı.
            errors:
              email: Bu e-posta adresi zaten kayıtlı.
    MethodNotAllowed:
      description: >
        Adres var ama HTTP yöntemi desteklenmiyor (405). Desteklenen yöntemler `Allow`
        başlığında döner.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            status: 405
            message: Bu adres için GET yöntemi desteklenmiyor.
            errors: {}
    NotAcceptable:
      description: >
        İstemcinin `Accept` başlığında istediği biçim üretilemiyor (406). API yalnız JSON
        üretir; hata gövdesi her durumda JSON'dur.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            status: 406
            message: İstenen yanıt biçimi desteklenmiyor.
            errors: {}
    PayloadTooLarge:
      description: >
        Yüklenen dosya izin verilen boyutu aşıyor (413): video en fazla 200 MB,
        PDF/doküman en fazla 20 MB, kapak görseli en fazla 2 MB.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            status: 413
            message: Video en fazla 200 MB olabilir.
            errors: {}
    UnsupportedMediaType:
      description: >
        Dosya türüne ya da isteğin Content-Type'ına izin verilmiyor (415). Dosya türü
        uzantıdan değil içerikten tespit edilir.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            status: 415
            message: Yalnız mp4 ve webm videolar yüklenebilir.
            errors: {}
    InternalServerError:
      description: >
        Beklenmeyen sunucu hatası (500). Yanıtta iç ayrıntı (stack trace, SQL vb.) yer
        almaz; ayrıntı yalnız sunucu loguna yazılır.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            status: 500
            message: Beklenmeyen bir hata oluştu. Lütfen daha sonra tekrar deneyin.
            errors: {}
