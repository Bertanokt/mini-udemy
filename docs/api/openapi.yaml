openapi: 3.0.3
info:
  title: Mini Udemy API
  version: 0.2.0
  description: >
    API sözleşmesi. Kod bu sözleşmeye uyar; değişiklik önce burada PR ile yapılır.


    Bu sürümde tüm modüllerin uçları tanımlıdır: auth ve profil, kategori ve katalog, kurs/bölüm/ders
    yönetimi, içerik yükleme ve sunma, kayıt, ilerleme, sınav, sertifika, yorum, şikâyet, bildirim,
    eğitmen paneli ve yönetici uçları.


    Roller: her uçta açıklamanın ilk satırında (**Rol:**) ve `x-roles` alanında yazılıdır.
    `PUBLIC` token gerektirmez. Rol yetmiyorsa 403; kaynağın sahibi olma şartı (ör. "kursun sahibi")
    sağlanmıyorsa da 403 döner. Yayımlanmamış kurs gibi varlığı gizlenmesi gereken kaynaklarda 404 döner.


    Sayfalı uçlar `page` (0'dan) ve `size` (varsayılan 20, en çok 100) alır; yanıt `PageMeta`
    alanlarını ve `content` listesini içerir.


    Kimlik doğrulama: `POST /api/auth/login` ile alınan JWT, korumalı uçlarda
    `Authorization: Bearer <accessToken>` başlığıyla gönderilir.


    Hatalar her zaman `ErrorResponse` gövdesiyle döner (`status`, `message`, `errors`);
    `message` kullanıcıya gösterilebilir Türkçe bir cümledir.
servers:
  - url: http://localhost:8080
tags:
  - name: Auth
    description: Kayıt, giriş ve parola yenileme. Bu uçlar herkese açıktır (token gerekmez).
  - name: Users
    description: Giriş yapmış kullanıcının kendi profili.
  - name: Categories
    description: Kurs kategorileri.
  - name: Catalog
    description: Herkese açık kurs kataloğu ve kurs detayı.
  - name: Courses
    description: Eğitmenin kurs yönetimi ve kurs durum geçişleri (State).
  - name: Sections
    description: Kurs bölümleri ve sıralaması.
  - name: Lessons
    description: Dersler, sıralama ve zorunlu ders işareti.
  - name: Content
    description: Ders içeriği ve kapak görseli yükleme/sunma (Factory Method, yetki kontrollü).
  - name: Enrollments
    description: Kursa kayıt ve kayıtlı kurslar.
  - name: Progress
    description: Ders tamamlama, ilerleme yüzdesi, kaldığı yerden devam.
  - name: Quizzes
    description: Soru bankası, bölüm sınavları, sınav çözme (Strategy) ve deneme geçmişi.
  - name: Certificates
    description: Sertifikalar ve herkese açık doğrulama.
  - name: Reviews
    description: Puan ve yorum.
  - name: Complaints
    description: Kurs ve yorum şikâyetleri.
  - name: Notifications
    description: Uygulama içi bildirimler.
  - name: Instructor
    description: Eğitmen paneli ve istatistikler.
  - name: Admin
    description: Yönetici uçları (onay/red/yayından kaldırma, kullanıcı, kategori, moderasyon, şikâyet, rapor).
paths:
  /api/health:
    get:
      summary: Backend ayakta mı
      operationId: getHealth
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: UP
                  service:
                    type: string
                    example: mini-udemy-backend
  /api/auth/register:
    post:
      tags: [Auth]
      summary: Öğrenci ya da eğitmen olarak kayıt ol
      description: >
        Yeni hesap oluşturur. `role` yalnızca `STUDENT` ya da `INSTRUCTOR` olabilir;
        `ADMIN` kayıtla oluşturulamaz (admin hesabı seed ile gelir) ve `role=ADMIN`
        gönderilirse istek 400 ile reddedilir. Parola BCrypt ile hash'lenerek saklanır.
        Kayıt token döndürmez; kullanıcı ardından `POST /api/auth/login` ile giriş yapar.
      operationId: register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
            examples:
              student:
                summary: Öğrenci kaydı
                value:
                  fullName: Ayşe Yılmaz
                  email: ayse.yilmaz@example.com
                  password: GucluParola123
                  role: STUDENT
              instructor:
                summary: Eğitmen kaydı
                value:
                  fullName: Mehmet Kaya
                  email: mehmet.kaya@example.com
                  password: GucluParola123
                  role: INSTRUCTOR
      responses:
        "201":
          description: Hesap oluşturuldu.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
              example:
                id: 42
                email: ayse.yilmaz@example.com
                fullName: Ayşe Yılmaz
                role: STUDENT
                bio: null
                createdAt: "2026-11-11T09:30:00Z"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/auth/login:
    post:
      tags: [Auth]
      summary: E-posta ve parola ile giriş yap
      description: >
        Bilgiler doğruysa JWT access token ve kullanıcı bilgisi döner. Yanlış e-posta
        ile yanlış parola aynı 401 yanıtını verir; hangisinin yanlış olduğu söylenmez.
        Hesap devre dışıysa (`active=false`) yalnızca parola doğrulandıktan sonra 403 döner.
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
            example:
              email: ayse.yilmaz@example.com
              password: GucluParola123
      responses:
        "200":
          description: Giriş başarılı.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
              example:
                accessToken: eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiI0MiIsInJvbGUiOiJTVFVERU5UIn0.c2lnbmF0dXJl
                tokenType: Bearer
                expiresIn: 3600
                user:
                  id: 42
                  email: ayse.yilmaz@example.com
                  fullName: Ayşe Yılmaz
                  role: STUDENT
                  bio: null
                  createdAt: "2026-11-11T09:30:00Z"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/auth/password-reset/request:
    post:
      tags: [Auth]
      summary: Parola yenileme bağlantısı iste
      description: >
        E-posta numaralandırmayı önlemek için kayıtlı olsun ya da olmasın her geçerli
        e-posta biçimine aynı `202` yanıtı döner. Kayıtlı kullanıcı için tek kullanımlık,
        süreli bir token üretilir ve `PasswordResetNotifier` arayüzüne verilir; dev
        profilinde bağlantı log'a yazılır, e-posta gönderilmez.
      operationId: requestPasswordReset
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetRequest"
            example:
              email: ayse.yilmaz@example.com
      responses:
        "202":
          description: >
            İstek alındı. E-posta kayıtlı olsa da olmasa da gövdesiz aynı yanıt döner.
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/auth/password-reset/confirm:
    post:
      tags: [Auth]
      summary: Token ile yeni parola belirle
      description: >
        Token geçerliyse parolayı değiştirir ve token'ı kullanılmış sayar. Geçersiz,
        süresi dolmuş ya da daha önce kullanılmış token ile yeni parola kuralına uymayan
        parola 400 döner.
      operationId: confirmPasswordReset
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetConfirmRequest"
            example:
              token: 3f9a1c7e5b2d4a80b6c1e9d2f7a45b30
              newPassword: YeniGucluParola456
      responses:
        "204":
          description: Parola değiştirildi.
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/me:
    get:
      tags: [Users]
      summary: Kendi profilimi getir
      description: Token'daki kullanıcının profilini döner.
      operationId: getMyProfile
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Kullanıcı profili.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
              example:
                id: 42
                email: ayse.yilmaz@example.com
                fullName: Ayşe Yılmaz
                role: STUDENT
                bio: Yazılım mühendisliği öğrencisiyim.
                createdAt: "2026-11-11T09:30:00Z"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Users]
      summary: Kendi profilimi güncelle
      description: >
        Yalnızca ad soyad ve kısa biyografi değiştirilebilir. E-posta ve rol bu uçla
        değiştirilemez; istekte bu alanlar bulunursa yok sayılmaz, 400 ile reddedilir.
      operationId: updateMyProfile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileRequest"
            example:
              fullName: Ayşe Yılmaz
              bio: Yazılım mühendisliği öğrencisiyim.
      responses:
        "200":
          description: Güncellenmiş profil.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
              example:
                id: 42
                email: ayse.yilmaz@example.com
                fullName: Ayşe Yılmaz
                role: STUDENT
                bio: Yazılım mühendisliği öğrencisiyim.
                createdAt: "2026-11-11T09:30:00Z"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/categories:
    get:
      tags: [Categories]
      summary: Kategorileri listele
      description: "**Rol:** herkese açık. Ada göre alfabetik sıralı tüm kategoriler."
      operationId: listCategories
      x-roles: [PUBLIC]
      security: []
      responses:
        "200":
          description: Kategori listesi.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CategoryResponse"
              example:
                - id: 1
                  name: Yazılım Geliştirme
                - id: 2
                  name: Veri Bilimi
  /api/courses:
    get:
      tags: [Catalog]
      summary: Katalogda kurs ara
      description: >
        **Rol:** herkese açık. Yalnız `PUBLISHED` durumundaki kurslar döner. Filtreler
        birlikte kullanılabilir (VE ile birleşir). `q` başlık ve açıklamada büyük/küçük harf
        duyarsız arar.
      operationId: searchCatalog
      x-roles: [PUBLIC]
      security: []
      parameters:
        - name: q
          in: query
          description: Başlık ya da açıklamada aranacak anahtar kelime.
          schema:
            type: string
            maxLength: 100
        - name: categoryId
          in: query
          schema:
            type: integer
            format: int64
        - name: level
          in: query
          schema:
            $ref: "#/components/schemas/CourseLevel"
        - name: instructorId
          in: query
          schema:
            type: integer
            format: int64
        - name: minRating
          in: query
          description: En düşük ortalama puan (1–5). Değerlendirmesi olmayan kurslar bu filtrede elenir.
          schema:
            type: number
            minimum: 1
            maximum: 5
        - name: sort
          in: query
          description: "Sıralama: `newest` (varsayılan), `title`, `rating`, `popular` (kayıt sayısı)."
          schema:
            type: string
            enum: [newest, title, rating, popular]
            default: newest
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: Sayfalı kurs özeti listesi.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseSummaryPage"
        "400":
          $ref: "#/components/responses/BadRequest"
    post:
      tags: [Courses]
      summary: Kurs oluştur
      description: >
        **Rol:** INSTRUCTOR. Kurs `DRAFT` durumunda oluşur; eğitmen token'dan alınır.
        Kapak görseli ayrı uçla yüklenir (`POST /api/courses/{id}/cover`).
      operationId: createCourse
      x-roles: [INSTRUCTOR]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCourseRequest"
      responses:
        "201":
          description: Oluşturulan kurs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/courses/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [Catalog]
      summary: Kurs detayı
      description: >
        **Rol:** herkese açık (yayımlanmış kurs). Yayımlanmamış kurs yalnız sahibi eğitmene
        ve ADMIN'e görünür; diğerlerine 404 döner (kursun varlığı açığa çıkmaz). Bölüm ve
        ders başlıkları `position` sırasıyla gelir; içerik dosyaları bu yanıtta yoktur.
      operationId: getCourseDetail
      x-roles: [PUBLIC]
      security:
        - {}
        - bearerAuth: []
      responses:
        "200":
          description: Kurs detayı.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseDetailResponse"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Courses]
      summary: Kursu güncelle
      description: >
        **Rol:** INSTRUCTOR (kursun sahibi). Yalnız `DRAFT` ve `UNPUBLISHED` durumlarında
        düzenlenebilir; diğer durumlarda 409.
      operationId: updateCourse
      x-roles: [INSTRUCTOR]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCourseRequest"
      responses:
        "200":
          description: Güncellenmiş kurs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      tags: [Courses]
      summary: Kursu sil
      description: >
        **Rol:** INSTRUCTOR (kursun sahibi). Yalnız `DRAFT` durumunda silinir; bölümler,
        dersler, soru bankası, sınavlar ve yüklenen dosyalar da kaldırılır. Diğer durumlarda 409.
        Daha önce yayımlanıp kursiyer almış (sonra taslağa dönmüş) kurs silinemez (409).
      operationId: deleteCourse
      x-roles: [INSTRUCTOR]
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Kurs silindi.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/courses/{id}/submit:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      tags: [Courses]
      summary: Kursu onaya gönder
      description: >
        **Rol:** INSTRUCTOR (kursun sahibi). `DRAFT → IN_REVIEW` ya da
        `UNPUBLISHED → IN_REVIEW`. Geçiş `CourseState` üzerinden yapılır; başka durumda 409.
        Kursta en az bir bölüm, bir ders ve içeriği yüklenmiş en az bir ders yoksa 400.
        Önceki red gerekçesi temizlenir.
      operationId: submitCourse
      x-roles: [INSTRUCTOR]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Yeni durumdaki kurs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/courses/{id}/unpublish:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      tags: [Courses]
      summary: Kendi kursumu yayından kaldır
      description: >
        **Rol:** INSTRUCTOR (kursun sahibi). `PUBLISHED → UNPUBLISHED`; gerekçe isteğe bağlı.
        Yayından kaldırılan kurs katalogda görünmez ve yeni kayıt almaz; önceden kayıtlı
        kursiyerler içeriğe erişmeye devam eder. Yönetici için: `POST /api/admin/courses/{id}/unpublish`.
      operationId: unpublishOwnCourse
      x-roles: [INSTRUCTOR]
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UnpublishCourseRequest"
      responses:
        "200":
          description: Yeni durumdaki kurs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/courses/{id}/cover:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [Content]
      summary: Kapak görselini getir
      description: "**Rol:** herkese açık. Kapak yoksa 404."
      operationId: getCourseCover
      x-roles: [PUBLIC]
      security: []
      responses:
        "200":
          description: Görsel dosyası.
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [Content]
      summary: Kapak görseli yükle
      description: >
        **Rol:** INSTRUCTOR (kursun sahibi). İzin verilen türler: jpg, png, webp; en fazla 2 MB.
        Tür dosyanın içeriğinden denetlenir (uzantıdan değil). Eski kapak varsa diskten de silinir.
        Düzenlenebilirlik `CourseState`'e göredir (yalnız `DRAFT` ve `UNPUBLISHED`).
      operationId: uploadCourseCover
      x-roles: [INSTRUCTOR]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/FileUpload"
      responses:
        "200":
          description: Kapak bağlanmış kurs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
  /api/courses/{id}/sections:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [Sections]
      summary: Kursun bölümlerini listele
      description: >
        **Rol:** herkese açık (yayımlanmış kurs); yayımlanmamış kursta yalnız sahibi ve ADMIN.
        `position` sırasıyla, her bölümün dersleriyle birlikte.
      operationId: listSections
      x-roles: [PUBLIC]
      security:
        - {}
        - bearerAuth: []
      responses:
        "200":
          description: Bölümler.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SectionResponse"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [Sections]
      summary: Bölüm ekle
      description: >
        **Rol:** INSTRUCTOR (kursun sahibi). Yeni bölüm sona eklenir (`position` = mevcut bölüm sayısı).
        Düzenlenebilirlik `CourseState`'e göredir.
      operationId: createSection
      x-roles: [INSTRUCTOR]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SectionRequest"
      responses:
        "201":
          description: Oluşturulan bölüm.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SectionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/sections/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    put:
      tags: [Sections]
      summary: Bölüm adını güncelle
      description: "**Rol:** INSTRUCTOR (kursun sahibi). Düzenlenebilirlik `CourseState`'e göredir."
      operationId: updateSection
      x-roles: [INSTRUCTOR]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SectionRequest"
      responses:
        "200":
          description: Güncellenmiş bölüm.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SectionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
