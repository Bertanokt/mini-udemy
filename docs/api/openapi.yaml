      summary: Ders içeriğini getir
      description: >
        **Rol:** kursa kayıtlı STUDENT, kursun eğitmeni ya da ADMIN; diğerleri 403, girişsiz 401.
        Video için HTTP `Range` desteklenir (206). `Content-Disposition`: video ve PDF için
        `inline`, doküman (docx, pptx) için `attachment`. Bu istek kursiyerin son izlenen
        dersini günceller.
      operationId: getLessonContent
      x-roles: [STUDENT, INSTRUCTOR, ADMIN]
      security:
        - bearerAuth: []
      parameters:
        - name: Range
          in: header
          required: false
          description: "Örn. `bytes=0-1048575`."
          schema:
            type: string
      responses:
        "200":
          description: Dosyanın tamamı.
          headers:
            Accept-Ranges:
              schema:
                type: string
                example: bytes
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "206":
          description: İstenen bayt aralığı.
          headers:
            Content-Range:
              schema:
                type: string
                example: bytes 0-1048575/52428800
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
