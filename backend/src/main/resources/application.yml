spring:
  application:
    name: mini-udemy-backend
  profiles:
    default: dev
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/miniudemy}
    username: ${DB_USERNAME:miniudemy}
    password: ${DB_PASSWORD:miniudemy}
  jpa:
    # Şema yalnız Flyway migration'ları ile değişir; Hibernate yalnız doğrular.
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
