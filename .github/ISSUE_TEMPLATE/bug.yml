name: Bug
description: Hatalı davranış bildirimi
labels: ["bug"]
body:
  - type: textarea
    id: adimlar
    attributes:
      label: Tekrar üretme adımları
      value: |
        1. 
        2. 
    validations:
      required: true
  - type: textarea
    id: beklenen
    attributes:
      label: Beklenen davranış
    validations:
      required: true
  - type: textarea
    id: gerceklesen
    attributes:
      label: Gerçekleşen davranış
      description: Hata mesajı, log, ekran görüntüsü
    validations:
      required: true
  - type: input
    id: ortam
    attributes:
      label: Ortam
      placeholder: "docker compose / yerel, tarayıcı, commit"
