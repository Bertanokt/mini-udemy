services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: miniudemy
      POSTGRES_USER: miniudemy
      POSTGRES_PASSWORD: miniudemy
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U miniudemy -d miniudemy"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_URL: jdbc:postgresql://postgres:5432/miniudemy
      DB_USERNAME: miniudemy
      DB_PASSWORD: miniudemy
      CORS_ALLOWED_ORIGINS: http://localhost:3000
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        # Tarayıcıdan erişilen adres; konteyner içi ağ adı değil.
        NEXT_PUBLIC_API_URL: http://localhost:8080
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
